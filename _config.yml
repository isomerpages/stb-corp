title: STB Corporate Website
url: https://www.open.gov.sg
favicon: /images/favicon.jpg
colors:
  primary-color: "#11817a"
  secondary-color: "#14729d"
  media-colors:
    - title: media-color-one
      color: "#0a655f"
    - title: media-color-two
      color: "#c3ece5"
    - title: media-color-three
      color: "#e0fffa"
    - title: media-color-four
      color: "#427f9b"
    - title: media-color-five
      color: "#344054"
description: An Isomer site of the Singapore Government
permalink: none
baseurl: ""
exclude:
  - travis-script.js
  - .travis.yml
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - Gemfile
  - Gemfile.lock
include:
  - _redirects
defaults:
  - scope:
      path: ""
    values:
      layout: page
custom_css_path: /misc/custom.css
custom_print_css_path: /assets/css/print.css
paginate: 12
remote_theme: isomerpages/isomerpages-template@next-gen
safe: false
plugins:
  - jekyll-feed
  - jekyll-assets
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme
staging: https://staging-lite.d3li67oiku6z7n.amplifyapp.com
prod: https://master.d3hum1wt4iidz4.amplifyapp.com
facebook-pixel: ""
shareicon: /images/isomer-logo.svg
is_government: true
google_analytics_ga4: ""
linkedin-insights: ""
resources_name: news-and-publications
